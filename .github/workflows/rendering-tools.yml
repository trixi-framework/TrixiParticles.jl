name: Rendering tools

on:
  pull_request:
    paths:
      - 'tools/rendering/**'
      - '.github/workflows/rendering-tools.yml'
  workflow_dispatch:

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - name: Install portable render dependencies
        run: python -m pip install meshio==5.3.5 numpy==2.0.2
      - name: Test parameters, timestamps, axes, and whitewater payloads
        run: python -m unittest discover -s tools/rendering/tests -v
      - name: Check the FoamGenerator build script interface
        run: python tools/rendering/build/build_foam_generator.py --help
